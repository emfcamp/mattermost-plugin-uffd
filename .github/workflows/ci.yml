name: ci
on:
  push:
    branches:
      - canon
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  plugin-ci:
    uses: mattermost/actions-workflows/.github/workflows/community-plugin-ci.yml@main
    secrets: inherit
    with:
      golang-version: "1.24.1"
      golangci-lint-version: "v2.0.2"
